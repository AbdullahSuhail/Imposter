<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Imposter Game</title>
</head>

<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">

    <h1>IMPOSTER</h1>

    <!-- Create Room Section -->
    <div style="
        margin-bottom: 25px;
        border: 1px solid #ddd;
        display: inline-block;
        padding: 20px;
        border-radius: 8px;
        width: 300px;
        box-sizing: border-box;
    ">

        <h3>Create a New Room</h3>

        <form action="{% url 'create_room' %}" method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="nickname"
                placeholder="Your Nickname"
                required
                style="
                    padding: 8px;
                    font-size: 1rem;
                    width: 100%;
                    box-sizing: border-box;
                "
            >

            <br><br>

            <button
                type="submit"
                style="
                    font-size: 1rem;
                    padding: 10px 20px;
                    cursor: pointer;
                "
            >
                Create Room
            </button>

        </form>
    </div>

    <br>

    <!-- Join Room Section -->
    <div style="
        margin-top: 10px;
        border: 1px solid #ddd;
        display: inline-block;
        padding: 20px;
        border-radius: 8px;
        width: 300px;
        box-sizing: border-box;
    ">

        <h3>Join an Existing Room</h3>

        {% if error %}
            <div style="
                color: #b02a37;
                background-color: #f8d7da;
                border: 1px solid #f1aeb5;
                padding: 8px 10px;
                border-radius: 5px;
                margin-bottom: 15px;
                font-size: 0.9rem;
                text-align: left;
                word-wrap: break-word;
            ">
                <strong>Error:</strong> {{ error }}
            </div>
        {% endif %}

        <form action="{% url 'home' %}" method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="nickname"
                placeholder="Your Nickname"
                required
                style="
                    padding: 8px;
                    font-size: 1rem;
                    width: 100%;
                    box-sizing: border-box;
                "
            >

            <br><br>

            <input
                type="text"
                name="code"
                placeholder="Room Code (e.g. X7K92)"
                maxlength="6"
                required
                style="
                    padding: 8px;
                    font-size: 1rem;
                    width: 100%;
                    box-sizing: border-box;
                    text-transform: uppercase;
                    text-align: center;
                "
            >

            <br><br>

            <button
                type="submit"
                name="join_room"
                style="
                    font-size: 1rem;
                    padding: 10px 20px;
                    cursor: pointer;
                "
            >
                Join Room
            </button>

        </form>
    </div>

</body>
</html>
